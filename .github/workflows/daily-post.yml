name: Daily Instagram post

on:
  schedule:
    - cron: "30 3 * * *"   # every day at 9:00 AM India time (03:30 UTC)
  workflow_dispatch:        # lets you press "Run workflow" to post right now
    inputs:
      dry_run:
        description: "Only make the image, don't post to Instagram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get install -y fonts-dejavu-core >/dev/null
          pip install pillow

      - name: Make today's post
        id: make
        run: |
          OUT=$(python make_post.py)
          echo "$OUT"
          echo "images=$(echo "$OUT" | python -c 'import json,sys; print(" ".join(json.load(sys.stdin)["images"]))')" >> "$GITHUB_OUTPUT"
          echo "day=$(echo "$OUT" | python -c 'import json,sys; print(json.load(sys.stdin)["day"])')" >> "$GITHUB_OUTPUT"

      - name: Upload the image so Instagram can fetch it
        run: |
          git config user.name "edutecjob-bot"
          git config user.email "actions@users.noreply.github.com"
          git add published play
          git commit -m "Add day ${{ steps.make.outputs.day }} images" || echo "nothing new"
          git push

      - name: Post to Instagram
        if: ${{ !inputs.dry_run }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
        run: |
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}"
          ARGS=""
          for IMG in ${{ steps.make.outputs.images }}; do ARGS="$ARGS --image-url $BASE/$IMG"; done
          sleep 20
          python post_to_instagram.py --caption-file caption.txt $ARGS

      - name: Move on to the next question
        if: ${{ !inputs.dry_run }}
        run: |
          python make_post.py --mark-posted
          git add state.json
          git commit -m "Posted day ${{ steps.make.outputs.day }}"
          git push
